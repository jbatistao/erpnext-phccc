version: '3.8'

services:
  configurator:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.5.0}
    restart: "no"
    pull_policy: always
    entrypoint:
      - bash
      - -c
    command:
      - >
        bench set-config -g db_host $$DB_HOST; bench set-config -gp db_port $$DB_PORT; bench set-config -g redis_cache "$$REDIS_CACHE"; bench set-config -g redis_queue "$$REDIS_QUEUE"; bench set-config -g redis_socketio "$$REDIS_QUEUE"; bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-3306}
      REDIS_CACHE: ${REDIS_CACHE}
      REDIS_QUEUE: ${REDIS_QUEUE}
      SOCKETIO_PORT: "9000"
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    networks:
      - default
      - coolify

  backend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.5.0}
    restart: unless-stopped
    pull_policy: always
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - default
      - coolify

  frontend:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.5.0}
    restart: unless-stopped
    pull_policy: always
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend
      - websocket
    ports:
      - "8080"
    labels:
      - "coolify.managed=true"
      - "coolify.port=8080"
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.erpnext.rule=Host(`ph.puntospanama.net`)"
      - "traefik.http.routers.erpnext.entrypoints=websecure"
      - "traefik.http.routers.erpnext.tls=true"
      - "traefik.http.routers.erpnext.tls.certresolver=letsencrypt"
      - "traefik.http.services.erpnext.loadbalancer.server.port=8080"
    networks:
      - default
      - coolify

  websocket:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.5.0}
    restart: unless-stopped
    pull_policy: always
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - default
      - coolify

  queue-short:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.5.0}
    restart: unless-stopped
    pull_policy: always
    command: bench worker --queue short,default
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - default
      - coolify

  queue-long:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.5.0}
    restart: unless-stopped
    pull_policy: always
    command: bench worker --queue long,default,short
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - default
      - coolify

  scheduler:
    image: frappe/erpnext:${ERPNEXT_VERSION:-v16.5.0}
    restart: unless-stopped
    pull_policy: always
    command: bench schedule
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully
    networks:
      - default
      - coolify

volumes:
  sites:


networks:
  coolify:
    external: true
